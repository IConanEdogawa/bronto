<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KORUZ Admin Login</title>
  <style>
    :root {
      --bg: #dfeaf0;
      --bg-2: #cddfe5;
      --panel: rgba(255,255,255,0.78);
      --panel-strong: #ffffff;
      --line: rgba(19,52,88,0.12);
      --text: #133458;
      --muted: #4a6379;
      --accent: #325E6A;
      --accent-strong: #0D47A1;
      --accent-soft: rgba(13,71,161,0.12);
      --shadow: 0 20px 50px rgba(19,52,88,0.12);
      --ring: rgba(13,71,161,0.14);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 18%, rgba(255,255,255,0.8), transparent 18%),
        radial-gradient(circle at 80% 12%, rgba(255,255,255,0.45), transparent 18%),
        linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 48%, #dfe8eb 100%);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-shell {
      position: relative;
      width: min(920px, 100%);
      min-height: 620px;
      border-radius: 32px;
      overflow: hidden;
      background: rgba(255,255,255,0.22);
      border: 1px solid rgba(255,255,255,0.36);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .login-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,0.25), rgba(255,255,255,0.04));
      pointer-events: none;
    }

    .login-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      min-height: 620px;
    }

    .visual {
      position: relative;
      padding: 48px 40px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.04)),
        linear-gradient(140deg, #dfeaf0 0%, #d1dfe5 28%, #bfd0d9 56%, #dfeaf0 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .visual::before,
    .visual::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(10px);
      opacity: 0.7;
    }

    .visual::before {
      width: 420px;
      height: 420px;
      background: rgba(255,255,255,0.18);
      right: -80px;
      top: -70px;
    }

    .visual::after {
      width: 460px;
      height: 460px;
      background: rgba(126, 146, 175, 0.18);
      left: -110px;
      bottom: -120px;
    }

    .brand {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 0.82rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(23, 29, 36, 0.8);
    }

    .brand-mark {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #eef5f8, #325E6A);
      box-shadow: 0 0 0 6px rgba(255,255,255,0.25);
    }

    .visual-content {
      position: relative;
      z-index: 1;
      max-width: 470px;
    }

    .eyebrow {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(35, 42, 54, 0.12);
      background: rgba(255,255,255,0.24);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.67rem;
      color: rgba(19,52,88,0.8);
    }

    h1 {
      margin: 22px 0 14px;
      font-size: clamp(2.6rem, 4vw, 4rem);
      line-height: 0.96;
      letter-spacing: -0.05em;
      font-weight: 800;
      color: #133458;
    }

    .visual p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.7;
      color: rgba(19,52,88,0.76);
      max-width: 32ch;
    }

    .stats {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      padding-top: 18px;
    }

    .stat {
      min-width: 120px;
      padding: 18px 20px;
      border-radius: 18px;
      border: 1px solid rgba(30, 35, 39, 0.08);
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
    }

    .stat strong {
      display: block;
      font-size: 1.4rem;
      color: #133458;
      margin-bottom: 4px;
    }

    .stat span {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(26, 29, 33, 0.72);
    }

    .form-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 44px 32px;
      background: rgba(255,255,255,0.46);
    }

    .form-box {
      width: min(420px, 100%);
      padding: 26px 28px 18px;
      border-radius: 26px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(20, 20, 20, 0.05);
      box-shadow: 0 10px 25px rgba(22, 28, 36, 0.06);
    }

    .form-box h2 {
      margin: 0 0 8px;
      font-size: 1.8rem;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .sub {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.6;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    label {
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(23, 28, 35, 0.7);
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid rgba(20, 27, 35, 0.1);
      border-radius: 14px;
      background: rgba(255,255,255,0.7);
      padding: 15px 16px;
      font-size: 1rem;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: rgba(191, 160, 101, 0.8);
      box-shadow: 0 0 0 5px var(--ring);
      transform: translateY(-1px);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.89rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .remember input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent-strong);
    }

    .link {
      color: rgba(28, 33, 38, 0.8);
      text-decoration: none;
      font-weight: 600;
    }

    .login-btn {
      margin-top: 8px;
      border: none;
      border-radius: 14px;
      padding: 16px 18px;
      font-size: 0.96rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      color: #1a1c1d;
      background: linear-gradient(135deg, #dfeaf0 0%, #9db8c6 40%, #325E6A 100%);
      box-shadow: 0 12px 22px rgba(50, 94, 106, 0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 26px rgba(50, 94, 106, 0.22);
    }

    .error {
      display: none;
      border-radius: 12px;
      padding: 10px 12px;
      background: rgba(168, 51, 51, 0.08);
      border: 1px solid rgba(168, 51, 51, 0.14);
      color: #8c2b2b;
      font-size: 0.9rem;
    }

    .error.show {
      display: block;
    }

    @media (max-width: 780px) {
      .login-grid {
        grid-template-columns: 1fr;
      }

      .visual {
        min-height: 250px;
      }

      .form-panel {
        padding-top: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-grid">
      <section class="visual">
        <div class="brand">
          <span class="brand-mark"></span>
          <span>KORUZ admin</span>
        </div>

        <div class="visual-content">
          <span class="eyebrow">control room</span>
          <h1>Hello &<br>Welcome</h1>
          <p>Manage your website content, update static details, and keep each brand version current with a soft, focused workspace.</p>
        </div>

        <div class="stats">
          <div class="stat">
            <strong>2</strong>
            <span>websites</span>
          </div>
          <div class="stat">
            <strong>24/7</strong>
            <span>access</span>
          </div>
        </div>
      </section>

      <section class="form-panel">
        <div class="form-box">
          <h2>Sign in</h2>
          <p class="sub">Use your admin credentials to edit website A and website B content.</p>

          <form id="loginForm">
            <div class="field">
              <label for="username">Username</label>
              <input id="username" name="username" type="text" placeholder="username" autocomplete="username" required />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
            </div>

            <div class="row">
              <label class="remember">
                <input type="checkbox" />
                <span>Remember me</span>
              </label>
              <a href="#" class="link">Need help?</a>
            </div>

            <div id="errorBox" class="error"></div>

            <button class="login-btn" type="submit">Login</button>
          </form>
        </div>
      </section>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const params = new URLSearchParams(window.location.search);
    const queryApiBase = params.get('apiBase');

    if (queryApiBase) {
      localStorage.setItem('koruz_api_base', queryApiBase);
    }

    const storedApiBase = localStorage.getItem('koruz_api_base') || '';
    const apiBase = queryApiBase || storedApiBase || (window.location.protocol.startsWith('http') ? window.location.origin : '');

    function buildApiUrl(path) {
      return apiBase ? `${apiBase}${path}` : path;
    }

    function getApiCandidates() {
      const candidates = [
        queryApiBase,
        storedApiBase,
        window.location.protocol.startsWith('http') ? window.location.origin : '',
        'http://127.0.0.1:63385',
        'http://localhost:63385'
      ];

      return [...new Set(candidates.filter(Boolean).map(base => base.replace(/\/$/, '')))];
    }

    async function postLogin(payload) {
      const candidates = getApiCandidates();
      const errors = [];

      for (const base of candidates) {
        try {
          const response = await fetch(`${base}/api/admin/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (response.status === 405 && base === window.location.origin) {
            errors.push(`${base}: HTTP 405`);
            continue;
          }

          const data = await readJsonSafe(response);
          return { response, data, apiBaseUsed: base };
        } catch (error) {
          errors.push(`${base}: ${error.message || 'request failed'}`);
        }
      }

      throw new Error(`Login API is not reachable. Tried: ${errors.join('; ')}`);
    }

    async function readJsonSafe(response) {
      const text = await response.text();
      if (!text) {
        return null;
      }

      try {
        return JSON.parse(text);
      } catch {
        return null;
      }
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      errorBox.textContent = '';
      errorBox.classList.remove('show');

      const payload = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value.trim()
      };

      try {
        const { response, data, apiBaseUsed } = await postLogin(payload);

        if (!response.ok) {
          const message = data?.message || (
            response.status === 405
              ? 'Login endpoint rejected POST. Start KoruzApi and try again.'
              : `Login failed (HTTP ${response.status})`
          );
          throw new Error(message);
        }

        if (!data) {
          throw new Error('Login failed: server returned an empty response.');
        }

        localStorage.setItem('koruz_admin_token', data.token || 'koruz-admin-demo-token');
        localStorage.setItem('koruz_admin_user', JSON.stringify(data.user || { username: payload.username }));
        localStorage.setItem('koruz_api_base', apiBaseUsed);

        window.location.href = 'admin-dashboard.html';
      } catch (error) {
        errorBox.textContent = error.message || 'Login failed. Check API host/port and try again.';
        errorBox.classList.add('show');
      }
    });
  </script>
</body>
</html>
