<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BM Holdings Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0f172a',
            mist: '#e2e8f0',
            accent: '#0ea5e9'
          },
          boxShadow: {
            soft: '0 20px 50px rgba(15, 23, 42, 0.12)'
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <div class="min-h-screen grid lg:grid-cols-2">
    <section class="hidden lg:flex flex-col justify-between p-12 bg-gradient-to-br from-slate-900 via-slate-800 to-sky-900 text-white">
      <div class="text-xs tracking-[0.25em] uppercase text-slate-300">BM Holdings · Admin</div>
      <div>
        <p class="text-sm text-sky-200 mb-3">Control room</p>
        <h1 class="text-5xl font-bold leading-tight tracking-tight mb-4">Hello &<br>Welcome</h1>
        <p class="text-slate-300 max-w-md leading-relaxed">Manage website content, contacts, images and category logo carousels in one place.</p>
      </div>
      <div class="flex gap-4">
        <div class="rounded-2xl bg-white/10 px-5 py-4 backdrop-blur">
          <div class="text-2xl font-semibold">2</div>
          <div class="text-xs uppercase tracking-wider text-slate-300">websites</div>
        </div>
        <div class="rounded-2xl bg-white/10 px-5 py-4 backdrop-blur">
          <div class="text-2xl font-semibold">24/7</div>
          <div class="text-xs uppercase tracking-wider text-slate-300">access</div>
        </div>
      </div>
    </section>

    <section class="flex items-center justify-center p-6 sm:p-10">
      <div class="w-full max-w-md rounded-3xl bg-white shadow-soft border border-slate-200 p-8">
        <h2 class="text-2xl font-bold tracking-tight mb-1">Sign in</h2>
        <p class="text-slate-500 text-sm mb-8">Use your admin credentials to edit Site A and Site B.</p>

        <form id="loginForm" class="space-y-5">
          <div>
            <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100 transition"
              placeholder="username" />
          </div>

          <div>
            <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100 transition"
              placeholder="••••••••" />
          </div>

          <div id="errorBox" class="hidden rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700"></div>

          <button type="submit"
            class="w-full rounded-xl bg-slate-900 text-white font-semibold py-3.5 hover:bg-slate-800 transition shadow-lg shadow-slate-900/10">
            Login
          </button>
        </form>
      </div>
    </section>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const params = new URLSearchParams(window.location.search);
    const queryApiBase = params.get('apiBase');
    if (queryApiBase) localStorage.setItem('koruz_api_base', queryApiBase);
    const storedApiBase = localStorage.getItem('koruz_api_base') || '';

    function getApiCandidates() {
      const candidates = [
        queryApiBase,
        storedApiBase,
        window.location.protocol.startsWith('http') ? window.location.origin : '',
        'http://127.0.0.1:63385',
        'http://localhost:63385'
      ];
      return [...new Set(candidates.filter(Boolean).map(base => base.replace(/\/$/, '')))];
    }

    async function readJsonSafe(response) {
      const text = await response.text();
      if (!text) return null;
      try { return JSON.parse(text); } catch { return null; }
    }

    async function postLogin(payload) {
      const errors = [];
      for (const base of getApiCandidates()) {
        try {
          const response = await fetch(`${base}/api/admin/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (response.status === 405 && base === window.location.origin) {
            errors.push(`${base}: HTTP 405`);
            continue;
          }
          const data = await readJsonSafe(response);
          return { response, data, apiBaseUsed: base };
        } catch (error) {
          errors.push(`${base}: ${error.message || 'request failed'}`);
        }
      }
      throw new Error(`Login API is not reachable. Tried: ${errors.join('; ')}`);
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      errorBox.textContent = '';
      errorBox.classList.add('hidden');

      const payload = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value.trim()
      };

      try {
        const { response, data, apiBaseUsed } = await postLogin(payload);
        if (!response.ok) throw new Error(data?.message || `Login failed (HTTP ${response.status})`);
        if (!data) throw new Error('Login failed: empty response.');

        localStorage.setItem('koruz_admin_token', data.token || 'koruz-admin-demo-token');
        localStorage.setItem('koruz_admin_user', JSON.stringify(data.user || { username: payload.username }));
        localStorage.setItem('koruz_api_base', apiBaseUsed);
        window.location.href = 'admin-dashboard.html';
      } catch (error) {
        errorBox.textContent = error.message || 'Login failed.';
        errorBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
