<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BM Holdings · Visual Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    [contenteditable="true"]:empty:before {
      content: attr(data-placeholder);
      color: #94a3b8;
      pointer-events: none;
    }
    [contenteditable="true"]:focus {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.08);
    }
    .section-canvas {
      background: #0B0B0C;
      color: #E8E8EA;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .section-canvas .muted { color: #8E8E93; }
    .section-canvas .dim { color: #5A5A5F; }
    .section-canvas .white { color: #fff; }
    .section-canvas .mono {
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8E8E93;
    }
    .editable-hit {
      cursor: text;
      min-width: 1ch;
      display: inline;
      border-bottom: 1px dashed transparent;
      transition: border-color .15s, background .15s;
    }
    .editable-hit:hover {
      border-bottom-color: #38bdf8;
      background: rgba(56, 189, 248, 0.06);
    }
    .lang-btn.active {
      background: #0f172a;
      color: #fff;
    }
    .nav-sec.active {
      background: #0f172a;
      color: #fff;
      border-color: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <div id="saveToast" class="fixed top-4 right-4 z-50 hidden max-w-sm rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-900 shadow-lg">
    <div class="font-semibold" id="toastTitle">Saved</div>
    <div id="toastBody" class="mt-1 text-emerald-800/80">Both languages saved.</div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
    <header class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-5 rounded-3xl bg-white border border-slate-200 shadow-sm px-5 py-4">
      <div>
        <div class="text-xs font-semibold tracking-[0.2em] uppercase text-slate-400">BM Holdings · Visual Editor</div>
        <h1 class="text-xl font-bold mt-0.5" id="siteLabel">Website</h1>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <div class="flex rounded-xl border border-slate-200 overflow-hidden bg-slate-50 p-0.5" role="group" aria-label="Language">
          <button type="button" id="langEn" class="lang-btn active px-4 py-2 text-sm font-semibold rounded-lg transition">EN</button>
          <button type="button" id="langKo" class="lang-btn px-4 py-2 text-sm font-semibold rounded-lg transition text-slate-600">KO</button>
        </div>
        <button id="backBtn" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold hover:bg-slate-50 transition">Back</button>
        <button id="viewBtn" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold hover:bg-slate-50 transition">View live</button>
        <button id="saveBtn" class="rounded-xl bg-slate-900 text-white px-4 py-2.5 text-sm font-semibold hover:bg-slate-800 transition shadow-lg shadow-slate-900/10">Save both languages</button>
      </div>
    </header>

    <div id="summary" class="mb-4 rounded-2xl border border-slate-200 bg-white px-5 py-3 text-sm text-slate-600 shadow-sm">Loading...</div>

    <div class="grid lg:grid-cols-[220px_1fr] gap-5">
      <aside class="space-y-1.5" id="sectionNav"></aside>

      <main class="min-w-0 space-y-5">
        <div class="rounded-3xl border border-slate-200 shadow-sm overflow-hidden bg-white" id="canvasCard">
          <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between gap-3">
            <div>
              <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Section preview</div>
              <div class="font-bold" id="sectionTitle">—</div>
            </div>
            <div class="text-xs text-slate-500">Click any text to edit · language: <span id="langBadge" class="font-semibold text-slate-800">EN</span></div>
          </div>
          <div id="sectionCanvas" class="section-canvas p-6 sm:p-8 min-h-[280px]"></div>
        </div>

        <section id="contactPanel" class="rounded-3xl border border-slate-200 bg-white shadow-sm p-5 hidden">
          <h2 class="text-xs font-bold tracking-[0.15em] uppercase text-slate-400 mb-3">Contact / Support</h2>
          <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Email</label>
              <input id="contactEmail" type="email" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100" />
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Telegram</label>
              <input id="contactTelegram" type="text" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100" />
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Phone</label>
              <input id="contactPhone" type="tel" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100" />
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Address</label>
              <input id="contactLocation" type="text" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100" />
            </div>
          </div>
        </section>

        <section id="carouselSection" class="rounded-3xl border border-slate-200 bg-white shadow-sm p-5 hidden">
          <h2 class="text-xs font-bold tracking-[0.15em] uppercase text-slate-400 mb-3">Category logo carousels</h2>
          <div class="grid md:grid-cols-2 gap-4" id="carouselGrid"></div>
        </section>

        <section id="imagesSection" class="rounded-3xl border border-slate-200 bg-white shadow-sm p-5 hidden">
          <h2 class="text-xs font-bold tracking-[0.15em] uppercase text-slate-400 mb-3">Images</h2>
          <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4" id="imageGrid"></div>
        </section>

        <div id="statusMessage" class="text-sm text-slate-500"></div>
      </main>
    </div>
  </div>

  <script src="/js/admin-visual-editor.js"></script>
</body>
</html>
