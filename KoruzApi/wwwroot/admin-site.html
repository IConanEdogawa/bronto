<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KORUZ Text Editor</title>
  <style>
    :root {
      --bg: #f5f2ee;
      --panel: #ffffff;
      --line: rgba(20, 23, 30, 0.08);
      --text: #1b1d22;
      --muted: #677180;
      --shadow: 0 18px 35px rgba(17, 21, 28, 0.07);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
    body { padding: 26px; }
    .container { max-width: 1180px; margin: 0 auto; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      margin-bottom: 24px; padding: 18px 22px; border-radius: 20px;
      background: rgba(255,255,255,0.72); border: 1px solid var(--line); box-shadow: var(--shadow);
    }
    .title { font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.8rem; }
    .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    button {
      border: none; border-radius: 12px; background: linear-gradient(135deg, #f0ddd0, #d4bc8d 60%, #c7a96d);
      color: #1a1d21; font-weight: 700; padding: 10px 14px; cursor: pointer;
    }
    .ghost { background: #fff; border: 1px solid var(--line); }
    .summary {
      margin-bottom: 18px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px;
      background: rgba(255,255,255,0.68); color: var(--muted);
    }
    .editor-grid { display: grid; gap: 14px; }
    .text-row {
      display: grid; grid-template-columns: 180px 1fr 1fr; gap: 12px; align-items: start;
      padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel);
      box-shadow: 0 10px 24px rgba(17, 21, 28, 0.04);
    }
    .text-row.static-row { grid-template-columns: 180px 1fr; }
    .key {
      font-family: Consolas, monospace; color: var(--muted); font-size: 0.84rem; overflow-wrap: anywhere;
      padding-top: 12px;
    }
    label { display: grid; gap: 7px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
    textarea {
      width: 100%; min-height: 74px; resize: vertical; border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 12px; font: inherit; color: var(--text); background: #fff; text-transform: none; letter-spacing: 0;
    }
    .group-title { margin: 22px 0 8px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .status { margin-top: 14px; color: var(--muted); }
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin-bottom: 8px;
    }
    .image-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 10px 24px rgba(17, 21, 28, 0.04);
    }
    .image-card h4 {
      margin: 0 0 10px;
      font-size: 0.95rem;
    }
    .image-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
      background: #eee;
      display: block;
      margin-bottom: 10px;
    }
    .image-card .meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 10px;
      word-break: break-all;
    }
    .image-card input[type="file"] {
      width: 100%;
      font-size: 0.85rem;
    }
    @media (max-width: 820px) {
      body { padding: 14px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .text-row { grid-template-columns: 1fr; }
      .key { padding-top: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <div class="title">KORUZ Text Editor</div>
        <div id="siteLabel" class="status"></div>
      </div>
      <div class="tools">
        <button class="ghost" id="backBtn">Back</button>
        <button class="ghost" id="viewBtn">View site</button>
        <button id="saveBtn">Save changes</button>
      </div>
    </div>

    <div class="summary" id="summary">Loading editable content...</div>

    <div class="group-title" id="imagesTitle" style="display:none;">Images</div>
    <div class="image-grid" id="imageGrid"></div>

    <div class="editor-grid" id="editorGrid"></div>
    <div id="statusMessage" class="status"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const siteCode = (params.get('site') || 'A').toUpperCase();
    const queryApiBase = params.get('apiBase');
    const pagePath = siteCode === 'B' ? 'site-b/index.html' : 'site-a/index.html';
    const siteName = siteCode === 'B' ? 'Website B' : 'Website A';
    const defaultImageKeys = siteCode === 'B'
      ? ['Cosmetics', 'Vehicle', 'Laptop']
      : [];

    if (queryApiBase) {
      localStorage.setItem('koruz_api_base', queryApiBase);
    }

    const token = localStorage.getItem('koruz_admin_token');
    if (!token) {
      window.location.href = 'admin-login.html';
    }

    document.getElementById('siteLabel').textContent = `${siteName} (${siteCode})`;

    let currentImages = {};

    function getApiCandidates() {
      const storedApiBase = localStorage.getItem('koruz_api_base') || '';
      const candidates = [
        queryApiBase,
        storedApiBase,
        window.location.protocol.startsWith('http') ? window.location.origin : '',
        'http://127.0.0.1:63385',
        'http://localhost:63385'
      ];

      return [...new Set(candidates.filter(Boolean).map(base => base.replace(/\/$/, '')))];
    }

    async function requestApi(path, options) {
      const errors = [];

      for (const base of getApiCandidates()) {
        try {
          const response = await fetch(`${base}${path}`, options);

          if ((response.status === 404 || response.status === 405) && base === window.location.origin) {
            errors.push(`${base}: HTTP ${response.status}`);
            continue;
          }

          localStorage.setItem('koruz_api_base', base);
          return response;
        } catch (error) {
          errors.push(`${base}: ${error.message || 'request failed'}`);
        }
      }

      throw new Error(`API is not reachable. Tried: ${errors.join('; ')}`);
    }

    async function readJsonSafe(response) {
      const text = await response.text();
      if (!text) return null;

      try {
        return JSON.parse(text);
      } catch {
        return null;
      }
    }

    async function loadOriginalTranslations() {
      const response = await fetch(pagePath);
      const html = await response.text();
      const match = html.match(/const\s+I18N\s*=\s*([\s\S]*?)\n};\s*\n\s*function\s+setLang/);

      if (!match) {
        throw new Error('Could not find the I18N text block in the original page.');
      }

      return Function(`"use strict"; return (${match[1]}\n});`)();
    }

    async function loadOriginalStaticText() {
      const response = await fetch(pagePath);
      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
      const staticText = {};
      let index = 0;

      while (walker.nextNode()) {
        const node = walker.currentNode;
        const text = node.nodeValue.trim();
        const parent = node.parentElement;
        if (!text || !parent) continue;
        if (parent.closest('script,style,noscript,template,[data-i18n]')) continue;
        index += 1;
        staticText[`static_${String(index).padStart(3, '0')}`] = text;
      }

      return staticText;
    }

    async function loadSavedContent() {
      const response = await requestApi(`/api/sitecontent/${siteCode}`);
      const data = await readJsonSafe(response);

      if (!response.ok) {
        throw new Error(data?.message || `Failed to load saved content (HTTP ${response.status})`);
      }

      return data?.siteContent || {};
    }

    function mergeTranslations(original, saved) {
      const merged = {};
      ['en', 'ko'].forEach(lang => {
        merged[lang] = {...(original[lang] || {}), ...(saved[lang] || {})};
      });
      return merged;
    }

    function sortedKeys(translations) {
      return [...new Set([
        ...Object.keys(translations.en || {}),
        ...Object.keys(translations.ko || {})
      ])].sort((a, b) => a.localeCompare(b));
    }

    function renderEditor(translations) {
      const grid = document.getElementById('editorGrid');
      grid.innerHTML = '';
      const title = document.createElement('div');
      title.className = 'group-title';
      title.textContent = 'Translated text';
      grid.appendChild(title);

      sortedKeys(translations).forEach(key => {
        const row = document.createElement('div');
        row.className = 'text-row';
        row.dataset.key = key;
        row.innerHTML = `
          <div class="key"></div>
          <label>English<textarea data-lang="en"></textarea></label>
          <label>Korean<textarea data-lang="ko"></textarea></label>
        `;
        row.querySelector('.key').textContent = key;
        row.querySelector('[data-lang="en"]').value = translations.en?.[key] || '';
        row.querySelector('[data-lang="ko"]').value = translations.ko?.[key] || '';
        grid.appendChild(row);
      });

      return sortedKeys(translations).length;
    }

    function renderStaticEditor(originalStaticText, savedStaticText) {
      const grid = document.getElementById('editorGrid');
      const title = document.createElement('div');
      title.className = 'group-title';
      title.textContent = 'Static HTML text';
      grid.appendChild(title);

      const merged = {...originalStaticText, ...(savedStaticText || {})};
      Object.keys(merged).forEach(key => {
        const row = document.createElement('div');
        row.className = 'text-row static-row';
        row.dataset.staticKey = key;
        row.innerHTML = `
          <div class="key"></div>
          <label>Text<textarea data-static-text="true"></textarea></label>
        `;
        row.querySelector('.key').textContent = key;
        row.querySelector('textarea').value = merged[key] || '';
        grid.appendChild(row);
      });

      return Object.keys(merged).length;
    }

    function renderImageEditor(images) {
      const grid = document.getElementById('imageGrid');
      const title = document.getElementById('imagesTitle');
      grid.innerHTML = '';

      const keys = [...new Set([...defaultImageKeys, ...Object.keys(images || {})])];
      if (!keys.length) {
        title.style.display = 'none';
        return 0;
      }

      title.style.display = 'block';
      currentImages = { ...(images || {}) };

      keys.forEach(key => {
        if (!(key in currentImages)) currentImages[key] = '';
        const url = currentImages[key] || '';
        const card = document.createElement('div');
        card.className = 'image-card';
        card.dataset.imageKey = key;
        card.innerHTML = `
          <h4></h4>
          <img alt="" />
          <div class="meta"></div>
          <input type="file" accept="image/jpeg,image/png,image/webp,image/gif" />
        `;
        card.querySelector('h4').textContent = key;
        const img = card.querySelector('img');
        const meta = card.querySelector('.meta');
        img.src = url || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160"><rect width="100%" height="100%" fill="#e8e8e8"/><text x="50%" y="50%" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="14">No image</text></svg>');
        meta.textContent = url || 'Using default image from HTML';

        card.querySelector('input[type="file"]').addEventListener('change', async (event) => {
          const file = event.target.files?.[0];
          if (!file) return;

          document.getElementById('statusMessage').textContent = `Uploading ${key}...`;
          try {
            const body = new FormData();
            body.append('file', file);
            const response = await requestApi('/api/upload', { method: 'POST', body });
            const result = await readJsonSafe(response);
            if (!response.ok) {
              throw new Error(result?.message || `Upload failed (HTTP ${response.status})`);
            }
            currentImages[key] = result.url;
            img.src = result.url;
            meta.textContent = result.url;
            document.getElementById('statusMessage').textContent = `${key} uploaded. Click Save changes to publish.`;
          } catch (error) {
            document.getElementById('statusMessage').textContent = error.message || 'Upload failed.';
          }
        });

        grid.appendChild(card);
      });

      return keys.length;
    }

    function collectTranslations() {
      const translations = { en: {}, ko: {} };

      document.querySelectorAll('.text-row').forEach(row => {
        const key = row.dataset.key;
        if (!key) return;
        row.querySelectorAll('textarea[data-lang]').forEach(input => {
          translations[input.dataset.lang][key] = input.value;
        });
      });

      return translations;
    }

    function collectStaticText() {
      const staticText = {};

      document.querySelectorAll('.text-row[data-static-key]').forEach(row => {
        staticText[row.dataset.staticKey] = row.querySelector('textarea').value;
      });

      return staticText;
    }

    async function saveSite() {
      const payload = {
        siteName,
        translations: collectTranslations(),
        staticText: collectStaticText(),
        images: currentImages
      };

      const response = await requestApi(`/api/sitecontent/${siteCode}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const result = await readJsonSafe(response);

      if (!response.ok) {
        throw new Error(result?.message || `Save failed (HTTP ${response.status})`);
      }

      document.getElementById('statusMessage').textContent = 'Saved successfully.';
    }

    document.getElementById('backBtn').addEventListener('click', () => window.location.href = 'admin-dashboard.html');
    document.getElementById('viewBtn').addEventListener('click', () => window.location.href = pagePath);
    document.getElementById('saveBtn').addEventListener('click', () => {
      document.getElementById('statusMessage').textContent = 'Saving...';
      saveSite().catch(error => {
        document.getElementById('statusMessage').textContent = error.message || 'Save failed.';
      });
    });

    Promise.all([loadOriginalTranslations(), loadOriginalStaticText(), loadSavedContent()])
      .then(([originalTranslations, originalStaticText, savedContent]) => {
        const imageCount = renderImageEditor(savedContent.images || {});
        const translationCount = renderEditor(mergeTranslations(originalTranslations, savedContent.translations || {}));
        const staticCount = renderStaticEditor(originalStaticText, savedContent.staticText || {});
        document.getElementById('summary').textContent =
          `${imageCount} images, ${translationCount} translated keys and ${staticCount} static text nodes loaded from ${pagePath}.`;
      })
      .catch(error => {
        document.getElementById('summary').textContent = error.message || 'Failed to load editable content.';
      });
  </script>
</body>
</html>
