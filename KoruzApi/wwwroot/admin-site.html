<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BM Holdings Text Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <header class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-6 rounded-3xl bg-white border border-slate-200 shadow-sm px-6 py-5">
      <div>
        <div class="text-xs font-semibold tracking-[0.2em] uppercase text-slate-400">BM Holdings · Editor</div>
        <h1 class="text-xl font-bold mt-1" id="siteLabel">Website</h1>
      </div>
      <div class="flex flex-wrap gap-2">
        <button id="backBtn" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold hover:bg-slate-50 transition">Back</button>
        <button id="viewBtn" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold hover:bg-slate-50 transition">View site</button>
        <button id="saveBtn" class="rounded-xl bg-slate-900 text-white px-4 py-2.5 text-sm font-semibold hover:bg-slate-800 transition shadow-lg shadow-slate-900/10">Save changes</button>
      </div>
    </header>

    <div id="summary" class="mb-6 rounded-2xl border border-slate-200 bg-white px-5 py-4 text-sm text-slate-600 shadow-sm">Loading editable content...</div>

    <section class="mb-8">
      <h2 class="text-xs font-bold tracking-[0.15em] uppercase text-slate-400 mb-3">Contact / Support</h2>
      <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4" id="contactGrid">
        <div class="rounded-2xl bg-white border border-slate-200 p-4 shadow-sm">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Email</label>
          <input id="contactEmail" type="email" placeholder="hello@company.com" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100" />
        </div>
        <div class="rounded-2xl bg-white border border-slate-200 p-4 shadow-sm">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Telegram</label>
          <input id="contactTelegram" type="text" placeholder="@handle" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100" />
        </div>
        <div class="rounded-2xl bg-white border border-slate-200 p-4 shadow-sm">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Phone</label>
          <input id="contactPhone" type="tel" placeholder="+82 ..." class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100" />
        </div>
        <div class="rounded-2xl bg-white border border-slate-200 p-4 shadow-sm">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Location</label>
          <input id="contactLocation" type="text" placeholder="Seoul, South Korea" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100" />
        </div>
      </div>
    </section>

    <section class="mb-8" id="carouselSection" style="display:none;">
      <h2 class="text-xs font-bold tracking-[0.15em] uppercase text-slate-400 mb-3" id="carouselTitle">Category logo carousels</h2>
      <div class="grid md:grid-cols-2 gap-4" id="carouselGrid"></div>
    </section>

    <section class="mb-8" id="imagesSection" style="display:none;">
      <h2 class="text-xs font-bold tracking-[0.15em] uppercase text-slate-400 mb-3" id="imagesTitle">Images</h2>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4" id="imageGrid"></div>
    </section>

    <section class="mb-6">
      <div class="space-y-4" id="editorGrid"></div>
    </section>

    <div id="statusMessage" class="text-sm text-slate-500"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const siteCode = (params.get('site') || 'A').toUpperCase();
    const queryApiBase = params.get('apiBase');
    const pagePath = siteCode === 'B' ? 'site-b/index.html' : 'site-a/index.html';
    const siteName = siteCode === 'B' ? 'Website B' : 'Website A';
    const defaultImageKeys = siteCode === 'B' ? ['Cosmetics', 'Vehicle', 'Laptop'] : [];
    const categorySections = siteCode === 'A'
      ? [
          { code: 'VHC', label: 'Vehicles (cars)' },
          { code: 'PRT', label: 'Auto parts' },
          { code: 'CSM', label: 'Cosmetics' },
          { code: 'LPT', label: 'Laptops' }
        ]
      : [];

    if (queryApiBase) localStorage.setItem('koruz_api_base', queryApiBase);
    const token = localStorage.getItem('koruz_admin_token');
    if (!token) window.location.href = 'admin-login.html';
    document.getElementById('siteLabel').textContent = `${siteName} (${siteCode})`;

    let currentImages = {};
    let currentCategoryImages = { VHC: [], PRT: [], CSM: [], LPT: [] };

    const inputClass = 'w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100';
    const cardClass = 'rounded-2xl bg-white border border-slate-200 p-4 shadow-sm';

    function authHeaders(extra) {
      return Object.assign({ 'Authorization': 'Bearer ' + token }, extra || {});
    }

    function getApiCandidates() {
      const storedApiBase = localStorage.getItem('koruz_api_base') || '';
      const candidates = [queryApiBase, storedApiBase, window.location.protocol.startsWith('http') ? window.location.origin : '', 'http://127.0.0.1:63385', 'http://localhost:63385'];
      return [...new Set(candidates.filter(Boolean).map(base => base.replace(/\/$/, '')))];
    }

    async function requestApi(path, options) {
      const errors = [];
      const opts = options || {};
      opts.headers = authHeaders(opts.headers || {});
      for (const base of getApiCandidates()) {
        try {
          const response = await fetch(`${base}${path}`, opts);
          if ((response.status === 404 || response.status === 405) && base === window.location.origin) {
            errors.push(`${base}: HTTP ${response.status}`);
            continue;
          }
          localStorage.setItem('koruz_api_base', base);
          return response;
        } catch (error) {
          errors.push(`${base}: ${error.message || 'request failed'}`);
        }
      }
      throw new Error(`API is not reachable. Tried: ${errors.join('; ')}`);
    }

    async function readJsonSafe(response) {
      const text = await response.text();
      if (!text) return null;
      try { return JSON.parse(text); } catch { return null; }
    }

    async function loadOriginalTranslations() {
      const response = await fetch(pagePath);
      const html = await response.text();
      const match = html.match(/const\s+I18N\s*=\s*([\s\S]*?)\n};\s*\n\s*function\s+setLang/);
      if (!match) throw new Error('Could not find the I18N text block in the original page.');
      return Function(`"use strict"; return (${match[1]}\n});`)();
    }

    async function loadOriginalStaticText() {
      const response = await fetch(pagePath);
      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
      const staticText = {};
      let index = 0;
      while (walker.nextNode()) {
        const node = walker.currentNode;
        const text = node.nodeValue.trim();
        const parent = node.parentElement;
        if (!text || !parent) continue;
        if (parent.closest('script,style,noscript,template,[data-i18n]')) continue;
        index += 1;
        staticText[`static_${String(index).padStart(3, '0')}`] = text;
      }
      return staticText;
    }

    async function loadSavedContent() {
      const response = await requestApi(`/api/sitecontent/${siteCode}`);
      const data = await readJsonSafe(response);
      if (!response.ok) throw new Error(data?.message || `Failed to load saved content (HTTP ${response.status})`);
      return data?.siteContent || {};
    }

    function mergeTranslations(original, saved) {
      const merged = {};
      ['en', 'ko'].forEach(lang => { merged[lang] = {...(original[lang] || {}), ...(saved[lang] || {})}; });
      return merged;
    }

    function sortedKeys(translations) {
      return [...new Set([...Object.keys(translations.en || {}), ...Object.keys(translations.ko || {})])].sort((a, b) => a.localeCompare(b));
    }

    function fillContact(contact) {
      const c = contact || {};
      document.getElementById('contactEmail').value = c.email || '';
      document.getElementById('contactTelegram').value = c.telegram || '';
      document.getElementById('contactPhone').value = c.phone || '';
      document.getElementById('contactLocation').value = c.location || '';
    }

    function collectContact() {
      return {
        email: document.getElementById('contactEmail').value.trim(),
        telegram: document.getElementById('contactTelegram').value.trim(),
        phone: document.getElementById('contactPhone').value.trim(),
        location: document.getElementById('contactLocation').value.trim()
      };
    }

    function normalizeUrlList(value) {
      if (!value) return [];
      if (Array.isArray(value)) return value.filter(Boolean);
      if (typeof value === 'string' && value.trim()) return [value.trim()];
      return [];
    }

    function renderCategoryCarousels(categoryImages) {
      const grid = document.getElementById('carouselGrid');
      const section = document.getElementById('carouselSection');
      grid.innerHTML = '';
      if (!categorySections.length) { section.style.display = 'none'; return 0; }
      section.style.display = 'block';
      const source = categoryImages || {};

      categorySections.forEach(sec => {
        currentCategoryImages[sec.code] = normalizeUrlList(source[sec.code]);
        const card = document.createElement('div');
        card.className = cardClass;
        card.innerHTML = `
          <h3 class="font-semibold mb-1"></h3>
          <p class="text-xs text-slate-500 mb-3">Upload logo images. Text logo marquee is not changed.</p>
          <div class="flex flex-wrap gap-2 mb-3 min-h-[64px] thumb-row"></div>
          <input type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple class="block w-full text-sm text-slate-600" />
        `;
        card.querySelector('h3').textContent = `${sec.label} · ${sec.code}`;
        const thumbs = card.querySelector('.thumb-row');

        const redraw = () => {
          thumbs.innerHTML = '';
          currentCategoryImages[sec.code].forEach((url, index) => {
            const thumb = document.createElement('div');
            thumb.className = 'relative h-16 w-16 rounded-xl border border-slate-200 bg-slate-50 overflow-hidden';
            thumb.innerHTML = `<img class="h-full w-full object-contain" alt="" /><button type="button" class="absolute top-1 right-1 rounded-md bg-white/90 border border-rose-200 text-rose-700 text-xs px-1.5 leading-none">×</button>`;
            thumb.querySelector('img').src = url;
            thumb.querySelector('button').addEventListener('click', () => {
              currentCategoryImages[sec.code].splice(index, 1);
              redraw();
            });
            thumbs.appendChild(thumb);
          });
        };
        redraw();

        card.querySelector('input[type="file"]').addEventListener('change', async (event) => {
          const files = [...(event.target.files || [])];
          if (!files.length) return;
          document.getElementById('statusMessage').textContent = `Uploading logos for ${sec.code}...`;
          try {
            for (const file of files) {
              const body = new FormData();
              body.append('file', file);
              const response = await requestApi('/api/upload', { method: 'POST', body });
              const result = await readJsonSafe(response);
              if (!response.ok) throw new Error(result?.message || `Upload failed (HTTP ${response.status})`);
              currentCategoryImages[sec.code].push(result.url);
            }
            redraw();
            document.getElementById('statusMessage').textContent = `${sec.code} logos updated. Click Save changes.`;
          } catch (error) {
            document.getElementById('statusMessage').textContent = error.message || 'Upload failed.';
          }
          event.target.value = '';
        });

        grid.appendChild(card);
      });
      return categorySections.length;
    }

    function renderEditor(translations) {
      const grid = document.getElementById('editorGrid');
      const title = document.createElement('h2');
      title.className = 'text-xs font-bold tracking-[0.15em] uppercase text-slate-400 mb-3';
      title.textContent = 'Translated text';
      grid.appendChild(title);

      sortedKeys(translations).forEach(key => {
        const row = document.createElement('div');
        row.className = cardClass + ' grid lg:grid-cols-[160px_1fr_1fr] gap-3';
        row.dataset.key = key;
        row.innerHTML = `
          <div class="text-xs font-mono text-slate-400 break-all pt-2 key"></div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500">English<textarea data-lang="en" class="${inputClass} mt-2 min-h-[80px]"></textarea></label>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500">Korean<textarea data-lang="ko" class="${inputClass} mt-2 min-h-[80px]"></textarea></label>
        `;
        row.querySelector('.key').textContent = key;
        row.querySelector('[data-lang="en"]').value = translations.en?.[key] || '';
        row.querySelector('[data-lang="ko"]').value = translations.ko?.[key] || '';
        grid.appendChild(row);
      });
      return sortedKeys(translations).length;
    }

    function renderStaticEditor(originalStaticText, savedStaticText) {
      const grid = document.getElementById('editorGrid');
      const title = document.createElement('h2');
      title.className = 'text-xs font-bold tracking-[0.15em] uppercase text-slate-400 mb-3 mt-8';
      title.textContent = 'Static HTML text';
      grid.appendChild(title);

      const merged = {...originalStaticText, ...(savedStaticText || {})};
      Object.keys(merged).forEach(key => {
        const row = document.createElement('div');
        row.className = cardClass + ' grid lg:grid-cols-[160px_1fr] gap-3';
        row.dataset.staticKey = key;
        row.innerHTML = `
          <div class="text-xs font-mono text-slate-400 break-all pt-2 key"></div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500">Text<textarea class="${inputClass} mt-2 min-h-[70px]"></textarea></label>
        `;
        row.querySelector('.key').textContent = key;
        row.querySelector('textarea').value = merged[key] || '';
        grid.appendChild(row);
      });
      return Object.keys(merged).length;
    }

    function renderImageEditor(images) {
      const grid = document.getElementById('imageGrid');
      const section = document.getElementById('imagesSection');
      grid.innerHTML = '';
      const keys = [...new Set([...defaultImageKeys, ...Object.keys(images || {})])];
      if (!keys.length) { section.style.display = 'none'; return 0; }
      section.style.display = 'block';
      currentImages = { ...(images || {}) };

      keys.forEach(key => {
        if (!(key in currentImages)) currentImages[key] = '';
        const url = currentImages[key] || '';
        const card = document.createElement('div');
        card.className = cardClass;
        card.innerHTML = `
          <h3 class="font-semibold mb-3"></h3>
          <img class="w-full h-40 object-cover rounded-xl bg-slate-100 mb-3" alt="" />
          <p class="text-xs text-slate-500 mb-3 break-all meta"></p>
          <input type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="block w-full text-sm text-slate-600" />
        `;
        card.querySelector('h3').textContent = key;
        const img = card.querySelector('img');
        const meta = card.querySelector('.meta');
        img.src = url || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160"><rect width="100%" height="100%" fill="#e8e8e8"/><text x="50%" y="50%" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="14">No image</text></svg>');
        meta.textContent = url || 'Using default image from HTML';

        card.querySelector('input[type="file"]').addEventListener('change', async (event) => {
          const file = event.target.files?.[0];
          if (!file) return;
          document.getElementById('statusMessage').textContent = `Uploading ${key}...`;
          try {
            const body = new FormData();
            body.append('file', file);
            const response = await requestApi('/api/upload', { method: 'POST', body });
            const result = await readJsonSafe(response);
            if (!response.ok) throw new Error(result?.message || `Upload failed (HTTP ${response.status})`);
            currentImages[key] = result.url;
            img.src = result.url;
            meta.textContent = result.url;
            document.getElementById('statusMessage').textContent = `${key} uploaded. Click Save changes.`;
          } catch (error) {
            document.getElementById('statusMessage').textContent = error.message || 'Upload failed.';
          }
        });

        grid.appendChild(card);
      });
      return keys.length;
    }

    function collectTranslations() {
      const translations = { en: {}, ko: {} };
      document.querySelectorAll('[data-key]').forEach(row => {
        const key = row.dataset.key;
        if (!key) return;
        row.querySelectorAll('textarea[data-lang]').forEach(input => {
          translations[input.dataset.lang][key] = input.value;
        });
      });
      return translations;
    }

    function collectStaticText() {
      const staticText = {};
      document.querySelectorAll('[data-static-key]').forEach(row => {
        staticText[row.dataset.staticKey] = row.querySelector('textarea').value;
      });
      return staticText;
    }

    async function saveSite() {
      const payload = {
        siteName,
        contact: collectContact(),
        translations: collectTranslations(),
        staticText: collectStaticText(),
        images: currentImages,
        categoryImages: currentCategoryImages
      };
      const response = await requestApi(`/api/sitecontent/${siteCode}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const result = await readJsonSafe(response);
      if (!response.ok) throw new Error(result?.message || `Save failed (HTTP ${response.status})`);
      document.getElementById('statusMessage').textContent = 'Saved successfully.';
    }

    document.getElementById('backBtn').addEventListener('click', () => window.location.href = 'admin-dashboard.html');
    document.getElementById('viewBtn').addEventListener('click', () => window.location.href = pagePath);
    document.getElementById('saveBtn').addEventListener('click', () => {
      document.getElementById('statusMessage').textContent = 'Saving...';
      saveSite().catch(error => {
        document.getElementById('statusMessage').textContent = error.message || 'Save failed.';
      });
    });

    Promise.all([loadOriginalTranslations(), loadOriginalStaticText(), loadSavedContent()])
      .then(([originalTranslations, originalStaticText, savedContent]) => {
        document.getElementById('editorGrid').innerHTML = '';
        fillContact(savedContent.contact || {});
        const carouselCount = renderCategoryCarousels(savedContent.categoryImages || {});
        const imageCount = renderImageEditor(savedContent.images || {});
        const translationCount = renderEditor(mergeTranslations(originalTranslations, savedContent.translations || {}));
        const staticCount = renderStaticEditor(originalStaticText, savedContent.staticText || {});
        document.getElementById('summary').textContent =
          `Ready. ${carouselCount} category carousels · ${imageCount} images · ${translationCount} translations · ${staticCount} static texts.`;
      })
      .catch(error => {
        document.getElementById('summary').textContent = error.message || 'Failed to load editable content.';
      });
  </script>
</body>
</html>
