# Example nginx site for KoruzApi
# 1) Copy to /etc/nginx/sites-available/koruzapi
# 2) ln -s /etc/nginx/sites-available/koruzapi /etc/nginx/sites-enabled/
# 3) Replace YOUR_DOMAIN with real domain
# 4) nginx -t && systemctl reload nginx
# 5) certbot --nginx -d YOUR_DOMAIN

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:5140;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
